name: Fetch Bokadirekt services (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify booking URLs
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          B=https://www.bokadirekt.se/boka-tjanst/noura-skin-secrets-kvinnlig-behandling-129600
          : > bd-verify.txt
          for s in klassisk-ansiktsrengoring-3490649 hifu-4d-runt-ogonen-3490677 harborttagning-helkropp-3490710 bogus-slug-3490649 klassisk-ansiktsrengoring-1111111; do
            curl -sSL -A "$UA" -o /tmp/p.html -w "$s http=%{http_code} final=%{url_effective}\n" "$B/$s" >> bd-verify.txt || echo "$s curl-failed" >> bd-verify.txt
            grep -o '<title>[^<]*</title>' /tmp/p.html | head -1 >> bd-verify.txt
            grep -o 'property="og:title" content="[^"]*"' /tmp/p.html | head -1 >> bd-verify.txt
          done
          cat bd-verify.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bd-verify.txt
          git commit -m "tmp: verify result"
          git pull --rebase origin main
          git push origin HEAD:main
